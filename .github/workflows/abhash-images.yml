name: Build and publish Abhash images

on:
  push:
    branches:
      - Abhash-Main
  pull_request:
    branches:
      - Abhash-Main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: abhash-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install site dependencies
        run: bun install --frozen-lockfile --cwd ./internal/site

      - name: Build site
        run: bun run --cwd ./internal/site build

      - name: Run Go tests
        run: go test ./...

      - name: Build hub binary
        run: CGO_ENABLED=0 go build -o /tmp/beszel ./internal/cmd/hub

      - name: Build agent binary
        run: CGO_ENABLED=0 go build -o /tmp/beszel-agent ./internal/cmd/agent

  publish:
    name: Publish GHCR images
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: beszel
            dockerfile: ./internal/dockerfile_hub
            description: Abhash Version Beszel hub
          - name: beszel-agent
            dockerfile: ./internal/dockerfile_agent
            description: Abhash Version Beszel agent
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize image namespace
        id: vars
        shell: bash
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install site dependencies
        run: bun install --frozen-lockfile --cwd ./internal/site

      - name: Build site
        run: bun run --cwd ./internal/site build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner_lc }}/${{ matrix.name }}
          labels: |
            org.opencontainers.image.title=${{ matrix.description }}
            org.opencontainers.image.description=${{ matrix.description }}
          tags: |
            type=raw,value=latest
            type=raw,value=abhash-main
            type=sha,prefix=abhash-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

